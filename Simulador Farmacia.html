<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="FarmaciaTitle">
        <h1 id="Farmacia"><img src="Imagenes/logoTopfarma.png" alt="LogoFarmacia" id="logoFarmacia"> Farmacia</h1>
        
        <div class="btn-iniciosesion">
            <header>
                <input type="text" id="usuario" placeholder="Usuario">
                <input type="password" id="contraseña" placeholder="Contraseña">
                <button onclick="iniciarSesion()">Iniciar sesion</button>
                <div  id="mensaje-iniciosesion" id="mensaje" class="ocultar"></div>
        </div>
        </header>
        <div class="Crear-cuentas">
                <header>
                    <button id="btn-crear-cuenta" onclick="mostrarformulario()">Crear cuenta</button>
                </header>
                <button id="btn-carrito">Carro de compras
                <img src="Imagenes/carrito.png" alt="Carrito" id="icono-carrito">
                </button>
                <div id="carrito">
                    <div class="carrito-">
                    </div>
                    <div id="carrito-lista">Total: $0</div>
                    <div class="total-carrito"></div>
                    <button id="btn-comprar">Comprar</button>
                    <button id="btn-vaciar">Vaciar carrito</button>
                </div>

            <div id="formulario-registro" style="display:none;">
                <form id="FormRegistro">
                    <h2 id="TituloRegist">Registro de usuarios</h2>
                    <label for="usuario">Elija un Usuario</label>
                    <input type="text" id="usuario1" required>
                        <div>
                            <label for="Correo">Correo</label>
                            <input type="email" id="correo" required>
                        </div>
                        <div>
                            <label for="Contraseña">Contraseña</label>
                            <input type="password" id="contraseña1" required>
                        </div>
                        <div>
                            <label for="ConfirContra">Confirmar Contraseña</label>
                            <input type="password" id="confircontra" required>
                        </div>
                        <div id="mensaje"></div>
                    <button type="submit" id="submit">Registrar</button>
                </form>
            </div>
        </div>
        <div class="buscador">
            <input type="text" id="buscarProducto" placeholder="¿Qué producto buscas?">
            <button id="btnBuscar">
                <img src="Imagenes/Buscador.png" alt="Lupa" id="icono-lupa">
            </button>
        </div>
    </div>
    
<div class="banner">
    <img src="Imagenes/BannerFarmacia.jpg" alt="Banner Farmacia" id="BannerFarmacia">
</div>
<div class="menu">
        <button id="menuOfertas">Ofertas</button>
        <button id="menuMedicamentos">Medicamentos</button>
        <button id="menuHigiene">Higiene</button>
        <button id="menuVitaminas">Vitaminas</button>
        <button id="menuContacto">Contacto</button>
</div>
    <div id="contenido"></div>

<script src="Simulador.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script id= "PagoCompra"src="PagoCompra.html"></script>
</body>
</html>
